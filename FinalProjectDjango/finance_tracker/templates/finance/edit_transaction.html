{% extends 'base.html' %}

{% block content %}

<h2>Edit Transaction</h2>

<form method="post">

    {% csrf_token %}

    {% for field in form %}

    <div class="mb-3">

        <label class="form-label">
            {{ field.label }}
        </label>

        {{ field }}

        {{ field.errors }}

    </div>

    {% endfor %}

    <button class="btn btn-primary">
        Save
    </button>

</form>

{% endblock %}
