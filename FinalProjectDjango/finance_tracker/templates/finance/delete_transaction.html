{% extends 'base.html' %}

{% block content %}

<h2>Delete Transaction</h2>

<p>
    Are you sure you want to delete
    <strong>{{ transaction.title }}</strong>?
</p>

<form method="post">

    {% csrf_token %}

    <button class="btn btn-danger">
        Delete
    </button>

    <a href="/" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
