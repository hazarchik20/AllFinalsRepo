{% load static %}
<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finance Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  
</head>

<body class="bg-dark">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="/">
                Finance Tracker
            </a>
            <div class="navbar-nav ms-4">

                <a class="nav-link text-white" href="/">
                    Dashboard
                </a>
                <a class="nav-link text-white" href="{% url 'statistics' %}">
                    Statistics
                </a>

                <a class="nav-link text-white" href="{% url 'vaults' %}">
                    Vaults
                </a>

            </div>

            <div class="ms-auto">

                {% if user.is_authenticated %}

                <span class="text-white me-3">
                    {{ user.username }}
                </span>

                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Logout
                    </button>
                </form>

                {% else %}

                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">
                    Login
                </a>

                <a href="{% url 'register' %}" class="btn btn-success btn-sm">
                    Register
                </a>

                {% endif %}

            </div>

        </div>

    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

</body>

</html>
