version: '3.9'

services:

  api:
    build:
      context: .
      dockerfile: FinalProjectASP_Net/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      - sqlserver
      - redis
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=JobBoardDb;User Id=sa;Password=SUPER_SECRET_HAZAR_PROJECT_KEY_123456789;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "SUPER_SECRET_HAZAR_PROJECT_KEY_123456789"
    ports:
      - "1433:1433"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"